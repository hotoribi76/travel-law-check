<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行業法 チェックテスト</title>
<style>
:root{
  --sumi:#1A1E27;
  --kon:#1F3A6E;
  --hi:#A8322C;
  --ai:#2C5F7C;
  --washi:#F3F4F0;
  --washi2:#FBFBF8;
  --keisen:#D6D8D0;
  --moegi:#5F7A3A;
  --mute:#71766E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--washi);
  color:var(--sumi);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.7;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 48px}

/* ---- header ---- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--washi);
  border-bottom:1px solid var(--keisen);
  padding:10px 0 8px;
}
.hd{display:flex;align-items:baseline;gap:10px}
.hd h1{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:17px;font-weight:600;letter-spacing:.06em;margin:0;
}
.hd .sub{font-size:11px;color:var(--mute);letter-spacing:.08em;margin-left:auto}
.bar{height:3px;background:var(--keisen);border-radius:2px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--kon);width:0;transition:width .25s ease}
.meta{display:flex;gap:12px;font-size:11.5px;color:var(--mute);margin-top:6px;letter-spacing:.04em}
.meta b{color:var(--sumi);font-weight:600}

/* ---- controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
select,.btn{
  font:inherit;font-size:13.5px;color:var(--sumi);
  background:var(--washi2);border:1px solid var(--keisen);
  border-radius:2px;padding:8px 10px;cursor:pointer;
}
select{flex:1 1 100%;min-width:0}
.btn:hover{border-color:var(--kon)}
.btn[aria-pressed="true"]{background:var(--kon);border-color:var(--kon);color:#fff}
.btn:focus-visible,select:focus-visible,.oxbtn:focus-visible{outline:2px solid var(--moegi);outline-offset:2px}

/* ---- card ---- */
.card{
  background:var(--washi2);
  border:1px solid var(--keisen);
  border-top:3px solid var(--kon);
  padding:20px 18px 18px;
  margin-top:14px;
  position:relative;
  min-height:170px;
}
.eyebrow{
  font-size:11px;letter-spacing:.12em;color:var(--kon);
  font-weight:600;margin-bottom:10px;
}
.eyebrow .no{
  display:inline-block;border:1px solid var(--kon);border-radius:2px;
  padding:0 5px;margin-right:7px;letter-spacing:.02em;
}
.q{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:16.5px;line-height:1.85;letter-spacing:.01em;
  text-align:justify;
}

/* ---- stamp ---- */
.stamp{
  position:absolute;top:14px;right:14px;
  width:58px;height:58px;border-radius:50%;
  display:grid;place-items:center;
  font-size:34px;font-weight:700;line-height:1;
  border:3px solid currentColor;
  opacity:0;pointer-events:none;
}
.stamp.on{animation:press .32s cubic-bezier(.2,1.5,.4,1) forwards}
.stamp.ok{color:var(--ai)}
.stamp.ng{color:var(--hi)}
@keyframes press{
  0%{opacity:0;transform:scale(2.1) rotate(-16deg)}
  100%{opacity:.82;transform:scale(1) rotate(-9deg)}
}
@media (prefers-reduced-motion:reduce){
  .stamp.on{animation:none;opacity:.82;transform:rotate(-9deg)}
  .bar i{transition:none}
}

/* ---- answer buttons ---- */
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.oxbtn{
  font:inherit;font-size:30px;line-height:1;
  padding:16px 0;border-radius:2px;cursor:pointer;
  background:var(--washi2);border:1.5px solid var(--keisen);
  transition:background .12s,border-color .12s;
}
.oxbtn.o{color:var(--ai)}
.oxbtn.x{color:var(--hi)}
.oxbtn:active{background:#ECEEE8}
.oxbtn:disabled{opacity:.35;cursor:default}
.oxbtn .lbl{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--mute);margin-top:6px}

/* ---- verdict ---- */
.verdict{margin-top:16px;display:none}
.verdict.show{display:block}
.vhead{font-size:13.5px;font-weight:700;letter-spacing:.06em;margin-bottom:8px}
.vhead.ok{color:var(--ai)}
.vhead.ng{color:var(--hi)}
.kaisetsu{
  border-left:3px solid var(--moegi);
  background:#fff;
  padding:11px 13px;font-size:14px;line-height:1.75;
  text-align:justify;
}
.kaisetsu .none{color:var(--mute)}
.next{
  width:100%;margin-top:12px;padding:13px 0;
  font:inherit;font-size:14.5px;font-weight:600;letter-spacing:.1em;
  background:var(--kon);color:#fff;border:none;border-radius:2px;cursor:pointer;
}
.next:hover{background:#162C55}

/* ---- footer / done ---- */
.done{padding:26px 18px;text-align:center}
.done .score{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:40px;letter-spacing:.02em;color:var(--kon);
}
.done .score small{font-size:16px;color:var(--mute)}
.done p{font-size:14px;color:var(--mute);margin:6px 0 18px}
.foot{margin-top:18px;font-size:11.5px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
.foot button{background:none;border:none;color:var(--mute);font:inherit;font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="hd">
    <h1>旅行業法 チェックテスト</h1>
    <span class="sub" id="hint">O / X キーでも回答</span>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta">
    <span id="pos">－</span>
    <span>正答 <b id="rate">–</b></span>
    <span>苦手 <b id="weak">0</b> 問</span>
  </div>
</header>

<div class="controls">
  <select id="cat"></select>
  <button class="btn" id="shuffle" aria-pressed="false">シャッフル</button>
  <button class="btn" id="wrongonly" aria-pressed="false">苦手だけ</button>
  <button class="btn" id="restart">はじめから</button>
</div>

<div id="stage"></div>

<div class="foot">
  <span>回答は端末に保存されます</span>
  <button id="clear">保存した記録を消す</button>
</div>

</div>

<script>
const DATA = [
{c:"【1】旅行業法の目的", note:"第1条", q:[
[1,"登録制度の実施","O","第1条は「手段」と「目的」の二段構え。手段は①登録制度の実施 ②業務の適正な運営の確保 ③旅行業協会の適正な活動の促進の3つで、これはその①。"],
[2,"旅行業の健全な発展","X","NGワード「発展」。業界を育てる法律ではなく、業者を規制して旅行者を守る法律。この視点を持てば大半の肢は切れる。"],
[3,"旅行業者の利便の増進","X","「旅行者」の利便の増進。一字違いの主語すり替えが本試験の定番なので、目的条文は必ず主語を確認する。"],
[4,"旅行の安全の確保","O","目的の3本柱＝①取引の公正の維持 ②旅行の安全の確保 ③旅行者の利便の増進。この3つは丸暗記推奨。"],
[5,"旅行業等を営む者の適正な利潤の確保","X","NGワード「利潤」。業者が儲かるようにする規定は旅行業法に一切ない。"],
[6,"旅行業等を営む者の業務の適正な運営を確保","O","手段の②。ここは主語が「旅行業等を営む者」で正しい（規制される側だから）。"],
[7,"取引の公正の維持","O","目的の3本柱の一つ。営業保証金も約款の認可も、すべてここに繋がっている。"],
[8,"旅行を通じた国際協調の促進","X","NGワード「国際」「親善」。観光立国推進基本法などと混同させる肢。"],
[9,"組織する団体の適正な活動を促進","O","手段の③で、この「団体」＝旅行業協会。協会の章（第3章）が存在する根拠でもある。"],
[10,"安全な旅行に関する旅行者に対する啓蒙活動","X","NGワード「啓蒙」。旅行者を教育する法律ではない。NGワードは 啓蒙・需要・発展・利益・利潤・経済・親善・国際 の8つ。"]
]},
{c:"【2】旅行業の定義", note:"報酬を得て事業として行った場合、登録が必要か（必要＝〇／不要＝✕）", q:[
[1,"一泊二日の箱根温泉バスツアーを企画販売する行為","O","募集型企画旅行そのもの。パッケージツアーは旅行業者の代表的商品で、他人の運送・宿泊を手配している。"],
[2,"コンビニが、航空会社やバス会社などから委託を受けて、旅行者に航空券やバスの回数券のみを販売する行為","X","運送機関の乗車券のみを発券する行為は旅行業から除外されている。「のみ」が付いたら不要を疑う。"],
[3,"タクシーの運転手が、乗客の求めに応じて有名観光地を案内する行為","X","宿泊を伴わない観光地巡りは、本来のタクシー会社の旅客運送事業であって旅行業ではない。自社の運送を売っているだけ。"],
[4,"バス会社自身が企画して、果樹園に日帰りツアーを実施する行為","X","自社バスのみで宿泊の手配もないため該当しない。逆にここで宿泊施設を手配すると旅行業になる。"],
[5,"ホテルが、近くのゴルフ場と提携して、「ゴルフ＋宿泊」のプランを募集する行為","X","旅客を宿泊させることは自らのホテル業。ゴルフ場は運送機関でも宿泊機関でもないので、他人の運送・宿泊の手配がゼロ。"],
[6,"お客に頼まれて、一泊二日の社員旅行のバスとホテルを手配する行為","O","依頼を受けて計画を立てる受注型企画旅行。他人のバスとホテルを手配しているので登録が必要。"],
[7,"イベント事業者が、航空券といっしょに他人の経営するホテルを手配する行為","O","他人の宿泊施設を手配している時点でアウト。Q2との違いは「運送のみか、宿泊が絡むか」。"],
[8,"観光案内所が旅行者に、他社が経営する貸切バスを予約・手配する行為","O","他人の運送サービスの手配。券を売るだけのQ2と違い、予約・手配をしている点がポイント。"],
[9,"旅行者に、スポーツ観戦の入場券のみを販売する行為","X","入場券は運送等関連サービス。これ「のみ」なら不要だが、バスやホテルの手配が付くと旅行業となる。"],
[10,"コンビニエンスストアが、旅行に関する相談に応ずる行為","O","旅行相談業務も旅行業に含まれる。事業として報酬を得て行うなら登録が必要。"],
[11,"フロントに置いているハワイ旅行のパンフレットについてホテルが相談に応じる行為","O","報酬を得て事業として行う前提なので必要。無料かつ一時的なら「事業として」に当たらず不要になる。"],
[12,"観光タクシー会社が自らのタクシーで、遊園地の入場券と昼食をセットにした日帰り旅行を実施する行為","X","自ら行う旅客自動車運送事業。入場券と昼食は運送等関連サービスに過ぎず、宿泊施設の手配もない。"],
[13,"宿泊事業者に、徒歩のみの日帰り花見ハイキングツアーを販売する行為","X","徒歩＝運送の手配なし、日帰り＝宿泊の手配なし。他人の運送・宿泊を一切手配していないので旅行業ではない。"]

{c:"【3】旅行業の登録制度①", note:"営業所では適切な旅行業務取扱管理者を選任しているものとする", q:[

[2,"第3種旅行業者は、国内を目的地とする募集型企画旅行を実施することができる。","O","原則不可だが、拠点区域内（営業所のある市町村＋隣接市町村など）に限り実施可能という例外がある。"],
[3,"第3種旅行業者は、海外を目的地とする手配旅行を実施することができる。","O","第3種でも手配旅行なら国内・海外を問わず可能。ただし営業所に総合旅行業務取扱管理者の選任が前提。"],
[4,"地域限定旅行業者は、募集型企画旅行を一切実施することはできない。","X","拠点区域内であれば国内の募集型企画旅行を実施できる。地域限定は「区域が拠点区域に限られる」だけで、旅行の種別が全部ダメなわけではない。"],
[5,"旅行業の登録の申請書には、営業所で選任している旅行業務取扱管理者の氏名を記載しなければならない。","X","取扱管理者の氏名は申請書の記載事項ではない。ただし営業所に掲示する標識には記載が必要（【12】Q5と対比）。"],
[6,"第2種旅行業の登録行政庁は、観光庁長官である。","X","観光庁長官なのは第1種だけ。第2種・第3種・地域限定・代理業・手配業はすべて都道府県知事。"],
[7,"旅行業の登録を取り消され、3年経過したものは、再び旅行業の登録を受けることができる。","X","欠格期間は取消しの日から5年。旅行業法の「5年」は登録取消・禁錮刑・取扱管理者の欠格でセットになる。"],
[8,"禁錮3年の刑に処せられても、執行が終わって5年以上が経過したものは、旅行業の登録を受けることができる。","O","禁錮以上の刑は罪名を問わず欠格事由だが、執行終了から5年経てば解消する。"],
[9,"道路交通法に違反して罰金の刑に処せられ、執行が終わって3年しか経過していないものは、旅行業の登録を受けることができない。","X","罰金刑が欠格事由になるのは旅行業法違反の場合のみ。他の法律の罰金刑は該当しない（禁錮以上なら罪名不問との差に注意）。"],
[10,"第2種旅行業を営もうとする者の財産的基礎（基準資産額）は、2,000万円以上である。","X","700万円以上。基準資産額は第1種3,000万／第2種700万／第3種300万／地域限定100万／代理業は規定なし。"],
[11,"地域限定旅行業者を営もうとする者の財産的基礎は、定められていない。","X","100万円以上。基準資産額の規定がないのは旅行業者代理業者だけ。"]
]},
{c:"【4】旅行業の登録制度②", note:"有効期間・更新・変更登録", q:[

[13,"2021年6月1日に登録した旅行業者の有効期間の満了日は、2026年5月31日である。","O","初日算入なので、5年後の応当日の前日が満了日になる。日付計算問題はこのルールで機械的に処理できる。"],
[14,"更新登録は、有効期間の満了の日の3ヵ月前までに申請しなければならない。","X","満了の日の2ヵ月前まで。旅行業法の「2ヵ月」はここだけなので狙われやすい。"],
[15,"更新登録がなされたときは、通知を受けた日から新たな有効期間が始まる。","X","従前の有効期間の満了日の翌日から起算。手続が遅れても期間が後ろにずれることはない。"],
[16,"旅行業者代理業者の更新登録の申請は、所属旅行業者が行う。","X","代理業者には有効期間の定めがないため、更新登録という手続き自体が存在しない（【15】Q10と同じ論点）。"],
[17,"旅行業者は、主たる営業所の所在地を変更したときは、登録事項変更届を登録行政庁に提出しなければならない。","O","変更の日から30日以内に届出。氏名・名称・住所・営業所の名称や所在地などは「届出」で足りる。"],
[18,"旅行業者が業務の範囲を第3種旅行業者から第2種旅行業者に変更するときは、変更登録をしなければならない。","O","業務範囲（第1〜3種・地域限定）の変更は事前の「変更登録」。事後の届出で済む登録事項の変更とは別物。"],
[19,"第2種旅行業者が業務の範囲を第1種旅行業者に変更するときは、観光庁長官に変更登録を申請しなければならない。","O","申請先は変更後の業務範囲に対応する登録行政庁。第1種になるなら観光庁長官。"],

]},
{c:"【5】営業保証金", note:"", q:[

[5,"第1種旅行業者の営業保証金の最低額は7,000万円である。","O","最低額は第1種7,000万／第2種1,100万／第3種300万／地域限定15万。基準資産額（3,000／700／300／100万）と混同しないこと。"],
[6,"第2種旅行業者の営業保証金の最低額は3,000万円である。","X","1,100万円。3,000万円は第1種の「基準資産額」の数字なので、狙って混ぜてある。"],
[7,"地域限定旅行業者の営業保証金の最低額は100万円である。","X","15万円。100万円は地域限定の基準資産額のほう。"],
[8,"営業保証金を供託した旅行業者は、登録の通知から14日以内に供託所の写しを添えて登録行政庁に届け出なければならない。","O","14日以内に届出。この届出をした後でなければ事業を開始できない。"],
[9,"営業保証金は必ず金銭で供託しなければならない。","X","金銭のほか国債・地方債などの有価証券でも供託できる。「必ず」「一切」という強い語は疑ってかかる。"],
[10,"旅行業者は前事業年度の旅行業務に関する旅行者との取引額を、毎事業年度終了後100日以内に登録行政庁に報告しなければならない。","O","「100日以内」は取引額の報告と追加供託の両方に共通する期限。"],
[11,"営業保証金から還付を受けられるのは、旅行業者等と取引をした旅行者に限られる。","O","運送機関・宿泊機関・ランドオペレーターは対象外。この制度は旅行者保護のためのもの。"],
[12,"還付がありその旨の通知を受けた旅行業者は、通知を受けてから14日以内に不足する額を供託し、届け出なければ登録は失効する。","O","還付で目減りした分の穴埋めは14日以内。協会の還付充当金が「7日以内」なのと対で覚える。"],
[13,"旅行業者の前事業年度の旅行者との取引額が増加し、供託すべき営業保証金が規定額に不足するときは、毎事業年度終了の日の翌日から100日以内に追加供託しなければならない。","O","取引額の増加による追加供託は100日以内。還付による不足の14日以内と原因が違う点に注意。"],
[14,"旅行業者が変更登録を受け、供託すべき営業保証金が減少するときは、直ちに営業保証金を取り戻すことができる。","X","6ヵ月を下らない一定期間内に申し出るべき旨の公告をしなければ取り戻せない。債権者に権利行使の機会を与えるため。"],
[15,"旅行業協会に加入している旅行業者は、営業保証金を供託する必要はない。","O","保証社員は代わりに弁済業務保証金分担金を協会に納付する。分担金は営業保証金の5分の1で済むのがメリット。"]
]},
{c:"【6】旅行業務取扱管理者", note:"", q:[
[1,"旅行業者等は、営業所に必ず1人以上の旅行業務取扱管理者を選任して、一定の業務に関する事務を行わせなければならない。","O","営業所ごとに最低1人。従業員が1人だけの営業所でも例外はない。"],
[2,"旅行業者等は、営業所で選任した旅行業務取扱管理者が欠けたときは、新たに選任するまでの間は一切の業務を行ってはならない。","X","禁止されるのは旅行業務に関する契約の締結だけ。既存契約の履行や相談対応まで止まるわけではない。"],
[3,"旅行業務取扱管理者は、一定の要件を満たした営業所では、他の営業所の旅行業務取扱管理者を兼任してもよい場合がある。","O","営業所間の距離の合計40km以下などの要件を満たせば兼任可。旅行サービス手配業務取扱管理者が兼務一切禁止なのと正反対（【16】Q16・Q17）。"],
[4,"旅行業の登録を取り消されてから5年を経過していないものは、旅行業務取扱管理者に選任されることはない。","O","欠格期間は5年。登録の欠格事由と同じ年数で揃っている。"],
[5,"営業所の業務範囲として「海外旅行」を取り扱うときは、その営業所では必ず要件を満たし、かつ総合旅行業務取扱管理者試験に合格した者を選任しなければならない。","O","海外を扱うなら総合一択。国内試験の合格者では海外を扱う営業所の管理者になれない。"],
[6,"営業所の業務範囲として「拠点区域の旅行のみ」を取り扱うときは、すべての種類の旅行業務取扱管理者を選任することができる。","O","総合・国内・地域限定のいずれでもよい。扱う範囲が狭いほど選べる資格が広がる、と理解する。"],
[7,"「料金の掲示」に関する事項は、旅行業務取扱管理者が管理・監督する事項である。","O","現場の取引の適正を守る事項は管理・監督の対象。料金の掲示はその代表例。"],
[8,"「旅行業約款の掲示及び備置き」に関する事項は、旅行業務取扱管理者が管理・監督する事項である。","O","約款の掲示・備置きも現場の取引に直結するため対象。なお約款の「認可申請」自体は事業者の仕事。"],
[9,"「書面の交付」に関する事項は、旅行業務取扱管理者が管理・監督する事項である。","O","取引条件説明書面・契約書面の交付は取引の中核。旅行者から求められれば管理者が最終的に説明する立場でもある。"],
[10,"「更新登録の申請」は、旅行業務取扱管理者が管理・監督する事項である。","X","登録関係の手続きは事業者の仕事。管理者の職務は「営業所での取引の適正確保」であって、会社の許認可事務ではない。"],
[11,"旅行業者等は、旅行業務取扱管理者について、3年ごとに旅行業務取扱管理者の職務に関し必要な知識等の向上を図るため、旅行業協会が実施する研修を受けさせなければならない。","X","研修受講は5年ごと。旅行業法の年数は5年が基本と覚え、例外（更新申請の2ヵ月前など）だけ個別に押さえる。"],
[12,"旅行業務取扱管理者は、旅行者から請求があったときは「旅行業務取扱管理者証」を提示しなければならない。","O","管理者証は請求があれば提示。外務員証は請求がなくても提示（【10】Q3）という差が頻出。"],
[13,"「旅行業務取扱管理者証」は、登録行政庁が発行したものを携帯しなければならない。","X","発行するのは旅行業者等（勤務先）。外務員証も同じく所属する旅行業者等が発行する。"]
]},
{c:"【7】料金の掲示", note:"", q:[
[1,"旅行業務の取扱いの料金とは、旅行業者に宿泊の予約を依頼したときの手配料金などを含む。","O","手配旅行や相談業務で旅行者から受け取る手数料が代表例。旅行代金そのものとは別物。"],
[2,"旅行業務取扱の料金には、企画旅行に係るものも含まれている。","X","パッケージツアー代金は取扱料金に含まれない。企画旅行の対価は旅行代金の中に織り込み済みだから掲示の対象外。"],
[3,"旅行業者等は、旅行業務の取扱いの料金をそれぞれの営業所において旅行者が閲覧することができるように備え置くことで足りる。","X","料金は営業所の見やすいところに「掲示」が必要。備え置き・閲覧では足りない。"],
[4,"旅行業者は旅行業務の取扱いの料金について、事業の開始前に定め、営業所に掲示しなければならない。","O","料金＝掲示のみ／約款＝掲示又は備え置き／標識＝掲示（公衆に）。この3点セットで整理する。"],
[5,"旅行業務の取扱いの料金は、定率又は定額のいずれかの方法で定めなければならない。","X","旅行者にとって明確であれば、定率・定額その他の方法で自由に決められる。「いずれか」と限定する肢は誤り。"],
[6,"旅行業者は旅行業務の取扱いの料金を基準に従って作成すれば、登録行政庁に届け出る必要はない。","O","料金は自由に決められ、届出も認可も不要。認可が要るのは約款だけ。"],
[7,"旅行業者は、事業の開始前に、旅行者から収受する旅行業務の取扱いの料金を定め、登録行政庁の認可を受けなければならない。","X","定めるのは事業開始前で正しいが、認可も届出も不要。"],
[8,"旅行業者は、旅行者から収受する旅行業務の取扱いの料金の額を変更したときは、遅滞なくその旨を登録行政庁に届け出なければならない。","X","制定時も変更時も、届出・認可は一切不要。"],
[9,"旅行業者代理業者の旅行業務の取扱いの料金は、所属旅行業者のものを用いなければならない。","O","代理業者は所属旅行業者の代理人。料金も約款も所属旅行業者のものを使う。"],
[10,"旅行業者代理業者は、その営業所において、自ら定めた旅行業務の取扱いの料金を旅行者に見やすいように掲示しなければならない。","X","掲示義務はあるが、掲示するのは所属旅行業者の料金。「自ら定めた」が誤り。"]
]},
{c:"【8】旅行業約款", note:"", q:[
[1,"旅行業者は旅行業約款を定め、登録行政庁の認可を受けなければならない。","O","料金は認可不要、約款は認可必要。旅行者の権利義務を左右する内容だから行政のチェックが入る。"],
[2,"旅行業者は旅行業約款を変更するときも、軽微な変更を除いて、認可を受けなければならない。","O","変更も原則認可。軽微な変更（誤字修正など）だけが例外。"],
[3,"旅行業者が、標準旅行業約款と同一の旅行業約款を定めたときは、その旨を登録行政庁に届け出なければならない。","X","認可を受けたものとみなされ、届出すら不要。実務上ほとんどの旅行業者がこのルートを使っている。"],
[4,"登録行政庁の約款の認可基準の一つに、「旅行業者の正当な利益を害するおそれがないものであること」がある。","X","「旅行業者の」ではなく「旅行者の」正当な利益。認可基準は旅行者保護の観点で作られている。"],
[5,"旅行業者等は、旅行業約款を旅行者に見やすいように、必ず掲示しなければならない。","X","約款は掲示又は備え置きのどちらかでよい。「必ず掲示」は料金のほう。"],
[6,"旅行業者が、標準旅行業約款よりも旅行者に有利な旅行業約款を定めたときは、当該旅行業約款については、登録行政庁の認可を受けることを要しない。","X","みなし認可は標準約款と「同一」の場合だけ。旅行者に有利であっても、同一でなければ認可が必要。"],
[7,"旅行業約款には、契約の変更及び解除に関する事項を記載しなければならない。","O","法定の記載事項。ほかに旅行業務の取扱いの料金、責任に関する事項なども含まれる。"],
[8,"旅行業者代理業者は、所属旅行業者の約款を用いなければならない。","O","代理人なので同じ約款。料金（【7】Q9）と同じ理屈。"],
[9,"旅行業者が標準旅行業約款と同一の約款を定めたときは、その約款は認可を受けたものとみなされる。","O","いわゆるみなし認可。Q3・Q10と同じ論点を角度を変えて聞いている。"],
[10,"旅行業者が現に認可を受けている約款を、標準旅行業約款と同一の約款に変更したときは、登録行政庁に届け出なければならない。","X","標準約款へ変更した場合もみなし認可が働き、認可も届出も不要。"],
[11,"旅行業者等は、旅行業約款をその営業所において掲示し、又は備え置き、旅行者と旅行業務に関し契約を締結しようとするときは、旅行者に対し、旅行業約款を交付しなければならない。","X","前半は正しいが、約款を「交付する」義務はない。交付義務があるのは取引条件説明書面と契約書面。"],
[12,"旅行業者の責任に関する事項が明確に定められているものであることは、旅行業約款の認可基準の一つである。","O","認可基準の一つ。旅行者が責任の所在を判断できることが求められる。"]
]},
{c:"【9】取引条件の説明", note:"※Q1〜Q9は資料に未収録", q:[
[10,"旅行業者は、旅行に関する相談に応ずる行為に係る旅行業務について、旅行者と契約を締結しようとするときは、取引条件の説明をすることを要しない。","X","相談業務も旅行業務の一種。他の契約と同様に取引条件の説明は必要。"],
[11,"旅行業者等は、旅行者と契約を締結しようとするときに、国土交通省令・内閣府令で定める事項を記載した書面を交付した場合は、取引条件の説明を要しない。","X","説明と書面交付は別の義務。書面を渡したから説明を省略してよい、とはならない（法第12条の4）。"],
[12,"旅行業者等は、書面の交付に代えて、旅行者の承諾を得て、書面に記載すべき事項を情報通信の技術を利用する方法により提供することができる。この場合、当該書面を交付したものとみなす。","O","電磁的方法は認められているが、旅行者の承諾が前提。業者側が一方的にメール送付で済ませることはできない。"],
[13,"旅行業者等は、取引条件の説明をするときは、対価と引換えに法第12条の5に規定するサービスの提供を受ける権利を表示した書面を交付する場合であっても、国土交通省令・内閣府令で定める事項を記載した書面を交付しなければならない。","X","航空券や宿泊予約券などを対価と引換えに交付する場合は、取引条件説明書面を省略できる。券自体が条件を示しているため。"],
[14,"旅行業者等は、契約に係る旅行業務取扱管理者の氏名及び旅行者の依頼があれば当該旅行業務取扱管理者が最終的には説明を行う旨を、書面に記載しなければならない。","O","取扱管理者の氏名等は、取引条件の説明書面と契約書面の両方に記載が必要。"],
[15,"旅行業者等は、旅行の目的地を勘案して、旅行者が取得することが望ましい安全及び衛生に関する情報がある場合にあっては、その旨及び当該情報を書面に記載しなければならない。","O","目的地の治安・感染症などの情報。海外旅行では特に重要な記載事項。"]
]},
{c:"【10】外務員", note:"", q:[
[1,"旅行業法で外務員とは、旅行業者等のために営業所以外の場所で、取引を行う役員をいう。","X","役員だけでなく使用人も含まれ、地位や名称に制限はない。"],
[2,"旅行業者等は、外務員に国土交通省が発行した外務員証を携帯させなければ、その者を外務員として従事させてはならない。","X","外務員証を発行するのは所属する旅行業者等。管理者証と同じく、行政が発行するものではない。"],
[3,"外務員は業務を行うときは、請求がなくても外務員証を提示しなければならない。","O","外務員は営業所外で取引するため、相手は相手方の素性を確認できない。だから請求を待たず提示する。管理者証は請求があれば提示。"],
[4,"外務員は、その所属する旅行業者等に代わって、旅行者との旅行業務に関する取引についての一切の行為を行う権限を有するものとみなされる。","X","「一切の裁判外の行為」。訴訟行為までは含まない。旅行者が悪意だった場合も除かれる。"],
[5,"外務員とは、勧誘員、販売員、外交員その他いかなる名称を有する者であるかを問わず、旅行業者等の役員又は使用人のうち、その営業所以外の場所でその旅行業者等のために旅行業務について取引を行う者をいう。","O","条文どおり。肩書きではなく「営業所外で取引をするか」という実態で判断する。"],
[6,"外務員は、その旅行業務を行うときは、外務員の証明書を提示しなければならない。","O","提示義務がある。Q3と同じ論点で、こちらは「請求がなくても」の文言がない形。"],
[7,"外務員は、旅行者が悪意であったときを除き、その所属する旅行業者等に代わって、旅行者との旅行業務に関する取引についての一切の裁判外の行為を行う権限を有するものとみなされる。","O","「裁判外」「悪意を除く」の2要素が揃った正しい形。旅行者を保護しつつ、悪意者までは守らない。"]
]},
{c:"【11】広告", note:"", q:[
[1,"「企画者の氏名又は名称及び住所並びに登録番号」は、企画旅行に参加する旅行者を募集するための広告に表示すべき事項である。","O","誰が責任を負う企画者なのかを明確にするため。責任の所在が広告表示事項の中心にある。"],
[2,"「旅程管理業務を行う者の同行の有無」は、企画旅行に参加する旅行者を募集するための広告に表示すべき事項である。","O","添乗員が付くかどうかは旅行者の判断に直結するため、必ず表示。"],
[3,"企画旅行に参加する旅行者を募集する広告は、企画者以外の者の氏名又は名称を表示することはできない。","X","販売する代理店名などを併記してよい。ただし文字の大きさ等に留意し、企画者が誰かを明確にする必要がある。"],
[4,"企画旅行に参加する旅行者を募集する広告に、旅行者が支払うべき対価が出発日により異なる場合は、必ず最高額を表示しなければならない。","X","最低額を表示するときは最高額も表示する。最多価格帯などを表示するときは最高額の表示は不要なので「必ず」が誤り。"],
[5,"「旅行地の景観、環境その他の状況に関する事項」は、旅行業務全般について広告するときに誇大表示として禁止されている。","O","例：海が少ししか見えないのに「オーシャンビュー」と表示するケース。"],
[6,"「旅行業者等の業務の範囲、資力又は信用に関する事項」は、旅行業務全般について広告するときに誇大表示として禁止されている。","O","例：根拠なく「業界ナンバーワン」と表示するケース。"],
[7,"旅行業者等は、旅行地における旅行者の安全の確保に関する事項について、著しく事実と相違する表示をしてはならない。","O","安全確保に関する事項も誇大広告の禁止対象。旅行の安全の確保は法第1条の目的そのもの。"],
[8,"旅行業者等は、業務の範囲、資力又は信用に関する事項について、実際のものよりも著しく優良であると人を誤認させるような表示をしてはならない。","O","「著しく事実と相違」「著しく優良・有利と誤認」の2類型が禁止される。例：販売実績が業界・地域ともに総合1位だと偽る。"],
[9,"旅行業者等は、旅行者が旅行業者等に支払うべき対価に関する事項について、実際のものよりも著しく有利であると人を誤認させるような表示をしてはならない。","O","例：実際にはない「過去にない破格値」と表示するケース。"],
[10,"誇大広告の禁止に関する規定は、旅行業者等が企画旅行以外の旅行業務について広告をするときには適用されない。","X","誇大広告が認められる例は一切ない。表示事項の規制は募集広告限定だが、誇大広告の禁止は旅行業務全般に及ぶ。"]
]},
{c:"【12】標識の掲示", note:"", q:[
[1,"旅行業者等は営業所において、標識（登録票）を旅行者に見やすいように掲示しなければならない。","X","標識は料金表と異なり、「旅行者」ではなく「公衆」に見やすいように掲示する。無登録営業を防ぐ趣旨だから対象が広い。"],
[2,"旅行業者の標識と、旅行業者代理業者の標識の記載内容は同一ではない。","O","代理業者には登録の有効期間がない代わりに、所属旅行業者に関する項目を記載する。"],
[3,"海外旅行を取り扱う業者の標識の地の色は青色である。","O","海外＝青、国内のみ＝白。海は青、と紐づけると覚えやすい。"],
[4,"国内業務のみ取り扱う業者の標識の地の色は白色である。","O","国内のみ＝白地。Q3と対で出題される定番。"],
[5,"標識には、営業所で選任している旅行業務取扱管理者の氏名を記載しなければならない。","O","登録申請書には不要だが標識には必要（【3】Q5と対比）。旅行者が誰に説明を求めればよいか分かるようにするため。"],
[6,"旅行業者等以外の者は、国土交通省令で定める様式の標識又はこれに類似する標識を掲示してはならない。","O","無登録業者が正規業者を装うのを防ぐため。違反すると30万円以下の罰金刑。"],
[7,"旅行業者等は、営業所において、国土交通省令で定める様式の標識を、旅行者に見やすいように備え置かなければならない。","X","備え置きではなく掲示、対象は旅行者ではなく公衆。2ヵ所が誤り。"],
[8,"旅行業者等の標識には、営業所において選任された旅行業務取扱管理者及び旅程管理業務を行う者のうち主任の者の氏名を記載しなければならない。","X","旅程管理業務を行う者（添乗員）の氏名は記載事項ではない。記載するのは取扱管理者の氏名のみ。"],
[9,"旅行業者等の標識には、法人である場合にあっては、営業所の名称及びその代表者の氏名を記載しなければならない。","X","法人の代表者（社長など）の氏名の記載は不要。"],
[10,"旅行業者代理業者の標識には、登録番号、登録年月日、所属旅行業者の登録の有効期間を記載しなければならない。","X","登録の有効期間は記載不要。代理業者自身に有効期間がないこととセットで理解する。"]
]},
{c:"【13】旅程管理措置", note:"", q:[
[1,"旅行業者は企画旅行を実施する場合は、旅行者に対する運送等サービスの確実な提供、変更を必要とする事由が生じた場合は、代替サービスその他の措置を講じなければならない。","O","旅程管理措置の基本形。手配旅行にはこの義務がなく、企画旅行だから課される。"],
[2,"旅行業者は、計画に定めるサービスの旅行者への確実な提供を確保するために募集の開始前に必要な予約その他の措置を講じなければならない。","X","「旅行」の開始前。募集開始前にすべての予約を終えている必要はない。"],
[3,"旅行業者は、2人以上の旅行者が同一の日程により行動することを要する区間における必要な集合時刻、集合場所その他の事項に関する指示をしなければならない。","O","「2人以上」がポイント。団体行動をする区間だけが対象で、自由行動中は対象外。"],
[4,"本邦外の旅行で、旅程管理の措置を講じない旨を旅行者に説明し、サービスの提供を受ける権利を表示した書面（航空券など）を交付してあれば、旅行業者は旅程管理のための措置を講じなくてもよい。","X","海外旅行では必ず旅程管理業務を行う。この例外が使えるのは国内旅行だけ。"],
[5,"旅行業者によって選任される、旅程管理業務を行う者のうち主任の者は、登録研修機関が実施する旅程管理業務に関する研修の課程を修了していなければならない。","O","主任の者になるには、拒否事由に該当しないこと・研修修了・実務経験の3つが必要。"],
[6,"旅程管理を行う者のうち主任の者に必要な旅程管理業務に関する実務の経験は、研修の課程を修了した日から1年以内に1回以上必要である。","X","研修修了日の「前後1年」に1回以上。修了日を起点に数えると、3年以内に2回以上という形になる。"],
[7,"複数の者が旅行に同行し添乗するときは、全員が旅程管理業務を行う者のうち主任の者の資格要件を満たしていなければならない。","X","添乗員が複数いる場合、そのうち誰か1人が資格要件を満たしていればよい。"],
[8,"旅行業者は、本邦外の旅行であって、サービスの提供を受ける権利を表示した書面を交付した場合は、旅行地において必要な手続の実施その他の措置を講ずることを要しない。","X","旅程管理義務の例外規定は国内旅行の場合だけ。海外旅行では免除されない（Q4と同じ論点）。"],
[9,"旅行業者は、本邦外の旅行であっては、計画に定めるサービスの内容の変更を必要とする事由が生じた場合は、代替サービスの手配及び必要な手続の実施その他の措置を講じなければならない。","O","海外旅行でも代替手配の義務は当然に及ぶ。国内で免除される場合があるのは一部の措置に限られる。"]
]},
{c:"【14】受託契約", note:"", q:[
[1,"受託契約において、委託旅行業者とは、募集型企画旅行を造成し販売を他の旅行業者に委託する業者をいう。","O","造成した側が委託旅行業者。旅行者と契約するのはこの委託旅行業者になる。"],
[2,"受託旅行業者とは、他社の募集型企画旅行を代理して販売する業者をいう。","O","販売する側が受託旅行業者。代理販売でも代理業の登録は不要という点が制度の眼目。"],
[3,"受託旅行業者代理業者とは、委託旅行業者を所属旅行業者とする旅行業者代理業者である。","X","受託旅行業者を所属旅行業者とする代理業者のこと。代理契約ではなく旅行業者間の受託契約である点が違う。"],
[4,"第3種旅行業者を委託旅行業者、第1種旅行業者を受託旅行業者として、受託契約を締結することができない。","X","委託旅行業者と受託旅行業者の組合せに制限はない。第何種かは関係ない。"],
[5,"受託契約は、旅行業者と旅行業者代理業者との間でも締結することができる。","X","旅行業者代理業者は契約の当事者にはなれない。当事者になるのは旅行業者どうし。"],
[6,"受託契約では、受託旅行業者や受託旅行業者代理業者の営業所を定めなければならない。","O","どの営業所で代理販売できるかを特定する。受託契約の必須内容の一つ。"],
[7,"受託旅行業者は委託旅行業者の旅行業約款を掲示または備え置かなければならない。","O","旅行者は委託旅行業者と契約するので、適用される約款も委託旅行業者のもの。"],
[8,"委託旅行業者及び受託旅行業者は、受託契約において、委託旅行業者を代理して企画旅行契約を締結することができる受託旅行業者の営業所を定めておく必要はない。","X","受託旅行業者又はその受託旅行業者代理業者の営業所を定めておかなければならない（Q6の裏返し）。"],
[9,"旅行業者は、他の旅行業者が実施する企画旅行について、複数の他の旅行業者と受託契約を締結することはできない。","X","旅行業者代理業は1社専属だが、受託契約は複数社と締結できる。だから店頭に各社のパンフレットが並ぶ。"],
[10,"旅行業者は、他の旅行業者が実施する企画旅行について、代理して企画旅行契約を締結する場合にあっては、当該他の旅行業者を所属旅行業者とする旅行業者代理業の登録を受けなければならない。","X","受託契約を結べば代理業の登録は不要。これが受託契約制度の存在意義。"]
]},
{c:"【15】旅行業者代理業者", note:"", q:[
[1,"旅行業者代理業者は、所属旅行業者の承諾を得れば、所属旅行業者以外の旅行業者のために旅行業務を取り扱うことができる。","X","1社専属が大原則。承諾があっても他社のためには取り扱えない（受託契約の複数社可と対比）。"],
[2,"旅行業者代理業者は、旅行業務に関し取引をしようとするときは、旅行業者代理業者である旨を取引の相手方に明示すれば、所属旅行業者の氏名又は名称を明示することを要しない。","X","所属旅行業者の氏名又は名称と、代理業者である旨の両方を明示する。旅行者にとって契約相手が誰かが最重要。"],
[3,"旅行業者代理業者は、その行う営業が旅行業であると誤認させ、又は所属旅行業者を誤認させるような表示、広告その他の行為をしてはならない。","O","違反すると登録行政庁から是正勧告措置。"],
[4,"旅行業者代理業者が旅行者に損害を与えた場合、原則として所属旅行業者が損害を賠償する責任がある。","O","代理人の行為の責任は本人が負うのが原則。ただしQ5の免責がある。"],
[5,"所属旅行業者は、旅行業者代理業者が旅行業務につき旅行者に加えた損害をいかなる場合も賠償する責めに任ずる。","X","委託につき相当の注意をし、損害の発生防止に努めたときは責任を免れる。「いかなる場合も」が誤り。"],
[6,"旅行業者代理業者は、所属旅行業者が旅行業の登録を抹消されても、自身の登録は有効なので他の旅行業者を所属旅行業者として営業を継続することができる。","X","所属旅行業者が登録を抹消されると代理業者自身の登録も失効する。1社専属の裏返し。"],
[7,"旅行業者代理業者は登録に際して財産的基礎と営業保証金について法的制限は規定されていない。","O","基準資産額も営業保証金も規定なし。自ら旅行者と契約する立場ではないため（現実には資金は必要）。"],
[8,"所属旅行業者が、受託契約において受託旅行業者代理業者を定めたときは、当該受託旅行業者代理業者は、所属旅行業者に加え、委託旅行業者のためにすべての旅行業務を取り扱うことができる。","X","扱えるのは募集型企画旅行業務のみ。すべての旅行業務ではない。"],
[9,"旅行業者代理業の登録は、所属旅行業者のために旅行業務を取り扱うことを内容とする契約が効力を失ったときは、その効力を失う。","O","代理契約が切れれば登録も自動的に失効する。"],
[10,"旅行業者代理業者の登録の有効期間は、登録の日から起算して5年とする。","X","代理業者に登録の有効期限はない。だから更新登録も不要（【4】Q16）。"]
]},
{c:"【16】旅行サービス手配業者", note:"※Q1〜Q10は資料に未収録", q:[
[11,"旅行サービス手配業者が法人である場合、その代表者の氏名に変更があったときは、その日から30日以内に、国土交通省令で定める書類を添付して、主たる営業所の所在地を管轄する都道府県知事に届け出なければならない。","O","変更の届出は30日以内。旅行業者の登録事項変更届（【4】Q17）と同じ期限。"],
[12,"旅行サービス手配業者は、運送サービスを提供する者に対し、輸送の安全の確保を不当に阻害する行為をしてはならない。","O","法第31条の禁止行為。無理な運行指示によるバス事故を受けて手配業が登録制になった経緯そのもの。"],
[13,"旅行サービス手配業者は、第2種旅行業者の営業所において選任されている旅行業務取扱管理者を、自らの営業所における旅行サービス手配業務取扱管理者として選任し、兼任させることができる。","X","兼任は認められていない。手配業務取扱管理者は他の営業所・他の立場との兼務が一切禁止。"],
[14,"旅行サービス手配業者は、手配業務を取り扱う者が1人である営業所についても手配業務取扱管理者を選任しなければならないが、本邦内の旅行のみを取り扱う営業所にあっては、総合又は国内旅行業務取扱管理者試験に合格した者を選任することができる。","O","国内のみなら総合又は国内の合格者でよい。海外を扱うなら総合が必要という構造は旅行業と同じ。"],
[15,"旅行サービス手配業者は、旅行サービス手配業務を他人に委託する場合においては、他の旅行サービス手配業者以外の者に委託してはならない。","X","委託自体は認められているが、委託先も旅行サービス手配業者としての資格が必要。文章としては誤りの形。"],
[16,"旅行サービス手配業務取扱管理者は、他の営業所の旅行サービス手配業務取扱管理者となることができない。","O","兼務・兼任は一切禁止。旅行業務取扱管理者に兼任の例外がある（【6】Q3）のと正反対。"],
[17,"手配業務取扱管理者を選任しなければならない営業所が複数ある場合、営業所間の距離の合計が40キロメートル以下であるときは、手配業務取扱管理者は複数の営業所を通じて1人で足りる。","X","40km以下の兼務規定は旅行業務取扱管理者の話。手配業務取扱管理者には適用されず、兼務は一切禁止。"],
[18,"旅行業者は、旅行サービス手配業の登録を受けなくても、旅行サービス手配業務を行うことができる。","O","旅行業登録を受けていれば重ねて手配業の登録は不要。より広い登録が狭い登録を包含する関係。"]
]},
{c:"【18】旅行業協会", note:"", q:[
[1,"旅行業協会は、旅行業者、旅行業者代理業者、旅行サービス手配業者が加入でき、運送機関や宿泊機関は旅行業協会の社員にはなれない。","O","社員になれるのはこの3者。運送・宿泊機関は旅行業法の規制対象ではないため入れない。"],
[2,"旅行業協会は、社員として資格を有する者が加入しようとするときは、現在の社員が加入の際に付されたよりも困難な条件を付してはならない。","O","既存社員が新規参入を締め出せないようにする規定。「創業〇年以上に限る」といった条件はNG。"],
[3,"旅行業協会の業務の一つに、「旅行者からの旅行業者等の取り扱った旅行業務に対する苦情の解決」がある。","O","法定業務の一つ。代理業者やランドオペレーターの取り扱った業務に対する苦情も含む。"],
[4,"旅行業協会の業務の一つに、「旅行業務又は旅行サービス手配業務の取扱いに従事する者に対する研修」がある。","O","法定業務の一つ。取扱管理者が5年ごとに受ける研修もこれ。"],
[5,"旅行業協会の業務の一つに、「旅行サービス手配業務の適切な運営を確保するための旅行サービス手配業者に対する指導」がある。","O","手配業者以外に旅行業者等に対する指導も含まれる。"],
[6,"旅行業協会の業務の一つに、「訪日外国人旅行者数の増加のための諸施策の推進」がある。","X","このような業務は法定されていない。振興・promotion系の業務は協会の法定業務に入らない。"],
[7,"旅行業協会は、旅行者から苦情について解決の申し出があったときは、社員である旅行業者が取り扱った場合のみ、応じればよい。","X","社員の取扱った業務に限らず、全国の旅行業者の取扱った苦情を対象にする。"],
[8,"旅行業協会は、苦情の解決について必要があると認めるときは、旅行業者等に対して文書若しくは口頭による説明を求め、又は資料の提出を求め、さらに立ち入り検査をすることができる。","X","立入検査などの強制力は発動できない。協会は行政庁ではないので、説明や資料の提出を求めるのが限界。"],
[9,"旅行業協会は、苦情の解決の結果について、社員のみに通知すればよい。","O","解決結果の通知は社員に対してで足りる。Q7（苦情の受付は社員以外も対象）との違いに注意。"],
[10,"旅行業協会が実施する研修は、社員以外の旅行業者等や旅行サービス手配業者の従業者も受けることができるようにしなければならない。","O","研修を社員限定にはできない。業界全体の質を上げるための法定業務だから。"],
[11,"弁済業務保証金制度により、保証社員と取引をした旅行者が弁済を受けることができるのは、当該旅行業者が納付している弁済業務保証金分担金の額の範囲内までである。","X","分担金の額の5倍まで。分担金は営業保証金の5分の1なので、5倍して営業保証金と同水準になる。"],
[12,"保証社員と取引をした旅行者及び当該保証社員から手配を依頼された旅行サービス手配業者は、弁済業務保証金から弁済を受ける権利を有する。","X","弁済を受けられるのは旅行者に限られる。手配業者や運送・宿泊機関は対象外（営業保証金と同じ）。"],
[13,"保証社員は、弁済業務規約の変更により弁済業務保証金分担金の額が増額されたときは、弁済業務規約で定める期日までに、その増額分を旅行業協会に納付しなければならない。","O","法第49条の3。増額分の納付先も協会。"],
[14,"旅行業協会から還付充当金を納付するよう通知を受けた保証社員が、通知を受けた日から7日以内に納付しないときは、当該保証社員は旅行業協会の社員の地位を失う。","O","「7日以内」は頻出（法第50条）。営業保証金の還付後の追加供託が14日以内なのと対で覚える。"],
[15,"弁済業務保証金から弁済を受ける権利を有する者は、その権利を実行しようとするときは、その債権について登録行政庁の認証を受けなければならない。","X","認証するのは旅行業協会（法第48条の2）。協会が窓口になる制度だから行政庁は出てこない。"],
[16,"旅行業協会に加入しようとする旅行業者は、登録行政庁から新規登録を受けた旨の通知を受けた日から7日以内に、弁済業務保証金分担金を納付しなければならない。","X","「加入しようとする日まで」に納付する（法第49条）。7日以内は還付充当金と協会の供託のほう。"],
[17,"旅行業協会は、保証社員から弁済業務保証金分担金の納付を受けたときは、保証社員の主たる営業所の最寄りの供託所に、弁済業務保証金として供託しなければならない。","X","納付の日から7日以内に、旅行業協会の最寄りの供託所に供託する。保証社員の最寄りではない。"],
[18,"旅行業協会に加入しようとする旅行業者は、加入しようとする日までに、弁済業務保証金分担金を供託所に納付しなければならない。","X","納付先は旅行業協会。協会がその額を弁済業務保証金として最寄りの供託所に供託する、という二段構え。"],
[19,"保証社員の弁済限度額は、その保証社員が旅行業協会に加入せず、営業保証金を供託していた場合の営業保証金の額を下回ることができない。","O","協会に入っているかどうかで旅行者の保護水準が変わるのは不合理だから。分担金5倍ルールの根拠でもある。"],
[20,"弁済業務保証金から還付を請求できるのは、保証社員やその旅行業者代理業者と旅行業務に関し取引をした旅行者に限られる。","O","営業保証金と同じ考え方。対象は旅行者のみ。"]
]},
{c:"【19】業務改善命令・業務停止・登録の取消", note:"", q:[
[1,"業務改善命令の一つに「旅行業務取扱管理者を解任すること」がある。","O","法第18条の3。ほかに旅行業約款の変更、旅程管理措置の確実な実施、料金の変更などがある。"],
[2,"業務改善命令の一つに「旅行業約款を変更すること」がある。","O","法第18条の3。認可を受けた約款でも、旅行者の利益を害するなら変更を命じられる。"],
[3,"登録行政庁は、旅行業者が旅行業法若しくはこれに基づく命令に違反したときは、1年以内の期間を定めて業務の全部もしくは一部の停止を命じることができる。","X","業務停止命令の期間は6ヵ月以内。「1年以内」は登録取消しの要件（Q5）で出てくる数字。"],
[4,"登録行政庁は、旅行業者が登録当時、登録を取り消されてから5年を経過していない者であったことが判明したときは、業務の停止又は登録の取消しを命じることができる。","O","登録当時に登録拒否事由に該当していたことが後から判明した場合。"],
[5,"登録行政庁は、旅行業者等が登録を受けてから6ヵ月に事業を開始せず、又は引き続き6ヵ月以上事業を行っていないと認めるときは、登録を取り消すことができる。","X","6ヵ月ではなく1年。業務停止が6ヵ月以内、休業による取消しが1年、と数字を入れ替えたひっかけ。"],
[6,"登録行政庁は、旅行業者に対し、旅行業協会に加入することを命ずることができる。","X","協会への加入は任意。行政が加入を命ずることはできない。"],
[7,"登録行政庁は、旅行業者に対し、企画旅行に係る旅程管理のための措置を確実に実施することを命ずることができる。","O","法第18条の3 I ④。業務改善命令の一つ。"],
[8,"登録行政庁は、旅行業者に対し、旅行業務取扱管理者を解任することを命ずることができる。","O","法第18条の3 I ①。Q1と同じ論点。"]
]}
];

/* ---------- state ---------- */
const KEY = "ryokogyoho-check-v1";
let store = {wrong:{}, seen:0, ok:0};
try{ const s = localStorage.getItem(KEY); if(s) store = Object.assign(store, JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

const flat = [];
DATA.forEach((cat,ci)=>cat.q.forEach(([n,text,ans,exp],qi)=>{
  flat.push({id:ci+"-"+qi, cat:cat.c, note:cat.note, n, text, ans, exp});
}));

let queue = [], idx = 0, answered = false, run = {ok:0, total:0};
let shuffled = false, wrongOnly = false;

const $ = s=>document.querySelector(s);
const catSel = $("#cat"), stage = $("#stage");

catSel.innerHTML = '<option value="all">全単元（' + flat.length + '問）</option>' +
  DATA.map((c,i)=>'<option value="'+i+'">'+c.c+'（'+c.q.length+'問）</option>').join("");

function build(){
  let pool = catSel.value === "all" ? flat.slice() : flat.filter(q=>q.id.startsWith(catSel.value+"-"));
  if(wrongOnly) pool = pool.filter(q=>store.wrong[q.id]);
  if(shuffled) for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  queue = pool; idx = 0; run = {ok:0,total:0};
  render();
}

function updateMeta(){
  $("#weak").textContent = Object.keys(store.wrong).length;
  $("#rate").textContent = run.total ? Math.round(run.ok/run.total*100)+"%" : "–";
  $("#pos").textContent = queue.length ? (Math.min(idx+1,queue.length))+" / "+queue.length+" 問" : "0 問";
  $("#bar").style.width = queue.length ? (idx/queue.length*100)+"%" : "0%";
}

function render(){
  updateMeta();
  if(!queue.length){
    stage.innerHTML = '<div class="card"><div class="done"><p style="margin-top:0">'+
      (wrongOnly ? "苦手リストは空です。まずは通常モードで解いてみてください。" : "この条件に該当する問題がありません。")+
      '</p></div></div>';
    return;
  }
  if(idx >= queue.length){
    const pct = Math.round(run.ok/run.total*100);
    stage.innerHTML = '<div class="card"><div class="done">'+
      '<div class="score">'+run.ok+'<small> / '+run.total+'</small></div>'+
      '<p>正答率 '+pct+'％　／　苦手リスト '+Object.keys(store.wrong).length+' 問</p>'+
      '<button class="next" id="again">もう一度</button></div></div>';
    $("#again").onclick = build;
    $("#bar").style.width = "100%";
    return;
  }

  const q = queue[idx];
  answered = false;
  stage.innerHTML =
    '<div class="card">'+
      '<div class="stamp" id="stamp"></div>'+
      '<div class="eyebrow"><span class="no">Q'+q.n+'</span>'+q.cat+'</div>'+
      '<div class="q">'+q.text+'</div>'+
      '<div class="ox">'+
        '<button class="oxbtn o" data-a="O">〇<span class="lbl">正しい</span></button>'+
        '<button class="oxbtn x" data-a="X">✕<span class="lbl">誤っている</span></button>'+
      '</div>'+
      '<div class="verdict" id="verdict"></div>'+
    '</div>';
  stage.querySelectorAll(".oxbtn").forEach(b=>b.onclick=()=>answer(b.dataset.a));
}

function answer(a){
  if(answered) return;
  answered = true;
  const q = queue[idx];
  const ok = a === q.ans;
  run.total++; if(ok) run.ok++;
  if(ok) delete store.wrong[q.id]; else store.wrong[q.id] = 1;
  save();

  const stamp = $("#stamp");
  stamp.textContent = ok ? "〇" : "✕";
  stamp.className = "stamp on " + (ok ? "ok" : "ng");
  stage.querySelectorAll(".oxbtn").forEach(b=>b.disabled=true);

  const v = $("#verdict");
  v.innerHTML =
    '<div class="vhead '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+'　正答は「'+(q.ans==="O"?"〇":"✕")+'」</div>'+
    '<div class="kaisetsu">'+(q.exp ? q.exp : '<span class="none">条文どおり。解説の補足はありません。</span>')+'</div>'+
    '<button class="next" id="nx">次の問題へ</button>';
  v.classList.add("show");
  $("#nx").onclick = next;
  updateMeta();
}

function next(){ idx++; render(); window.scrollTo({top:0,behavior:"instant"}); }

/* ---------- controls ---------- */
catSel.onchange = build;
$("#shuffle").onclick = e=>{ shuffled=!shuffled; e.currentTarget.setAttribute("aria-pressed",shuffled); build(); };
$("#wrongonly").onclick = e=>{ wrongOnly=!wrongOnly; e.currentTarget.setAttribute("aria-pressed",wrongOnly); build(); };
$("#restart").onclick = build;
$("#clear").onclick = ()=>{ store={wrong:{},seen:0,ok:0}; save(); build(); };

document.addEventListener("keydown",e=>{
  const k = e.key.toLowerCase();
  if(!answered && (k==="o"||k==="1"||k==="arrowleft")) answer("O");
  else if(!answered && (k==="x"||k==="2"||k==="arrowright")) answer("X");
  else if(answered && (k==="enter"||k===" ")){ e.preventDefault(); next(); }
});

build();
</script>
</body>
</html>
